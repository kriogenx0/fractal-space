worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /usr/share/nginx/html/seo-routes.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    server {
        listen 8080;
        server_name _;
        # Coolify terminates HTTPS; redirects must not expose the internal port.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        # URLs are stable across releases; revalidate before reusing assets.
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ /\. {
            return 404;
        }

        # Per-experiment HTML for the existing public query URLs, for every client.
        # A missing work must stay a real 404 rather than opening a fallback artwork.
        location ~ ^/(experiment|fractal|wild|math|levitated)\.html$ {
            try_files $seo_page =404;
        }

        # Serve the root directly: the index module would internally reselect
        # /index.html and hit its public canonical redirect.
        location = / {
            try_files /index.html =404;
        }

        location = /index.html {
            return 301 /$is_args$args;
        }

        location = /seo-routes.conf { return 404; }
        location ^~ /_pages/ { internal; }

        # Real documents, not a SPA fallback: missing scripts must stay 404s.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
