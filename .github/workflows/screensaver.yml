name: macOS screensaver

on:
  push:
    branches: [main]
    paths: ['macos/**', 'dist/**', '.github/workflows/screensaver.yml']
  pull_request:
    paths: ['macos/**', 'dist/screensaver/**', '.github/workflows/screensaver.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build FractalSpace.saver
        run: bash macos/build.sh
      - name: Smoke test the built saver
        run: swift macos/smoke.swift macos/build/FractalSpace.saver saver-snapshot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saver-snapshot
          path: saver-snapshot.png
          if-no-files-found: ignore
      - name: Package
        run: ditto -c -k --keepParent macos/build/FractalSpace.saver FractalSpace.saver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FractalSpace.saver
          path: FractalSpace.saver.zip
