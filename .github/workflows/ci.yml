name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate scripts and deployment definitions
        run: |
          bash -n bin/development scripts/smoke.sh
          docker compose -f docker-compose.yml --profile tools config --quiet
          docker compose -f docker-compose.production.yml config --quiet
          make coolify-check
      - name: Test site and production image
        run: make test
