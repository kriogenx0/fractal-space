<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#000000"><title>Screensaver — Fractal Space</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:none}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.6s ease;pointer-events:none;background:#000}
iframe.on{opacity:1}
#caption{position:fixed;left:clamp(16px,4vw,48px);bottom:clamp(16px,4vh,44px);z-index:2;font:500 13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#caption.on{opacity:1}
#caption b{display:block;font:400 22px/1.2 Georgia,serif;letter-spacing:0;text-transform:none;color:#fff}
#caption progress{display:block;width:180px;height:2px;margin-top:10px;appearance:none;border:0;background:rgba(255,255,255,.2)}
#caption progress::-webkit-progress-bar{background:rgba(255,255,255,.2)}
#caption progress::-webkit-progress-value{background:rgba(255,255,255,.85)}
#loader{position:fixed;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:18px;color:rgba(255,255,255,.7);font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;transition:opacity 1s ease;pointer-events:none}
#loader i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.85);animation:spin 1s linear infinite}
#loader.done{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#loader i{animation-duration:3s}}
#caption progress::-moz-progress-bar{background:rgba(255,255,255,.85)}
</style></head><body>
<iframe id="frame-a" title="Screensaver artwork" tabindex="-1"></iframe><iframe id="frame-b" title="Screensaver artwork" tabindex="-1"></iframe>
<div id="loader" role="status"><i aria-hidden="true"></i><span>Loading Fractal Space…</span></div>
<div id="caption" aria-live="polite"><b id="caption-title"></b><span id="caption-param"></span><progress id="caption-progress" max="1" value="0"></progress></div>
<script type="module" src="screensaver.js"></script>
</body></html>
