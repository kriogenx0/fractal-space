services:
  app:
    image: fractal-space:dev
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${PORT:-3080}:8080"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  test:
    profiles: [tools]
    build:
      context: .
      target: test
    image: fractal-space:test

  seo:
    profiles: [tools]
    build:
      context: .
      target: seo
    image: fractal-space:seo
    volumes:
      - ./dist:/app/dist
